<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; display: none; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-top: 0; }
        
        .tab-menu { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; background: #f9f9f9; border: none; font-size: 15px; font-weight: bold; color: #777; border-radius: 8px 8px 0 0; }
        .tab-btn:hover { background: #eee; }
        .tab-btn.active { background: white; color: #2c3e50; border: 2px solid #ddd; border-bottom: 2px solid white; margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="text"] { padding: 10px; width: 65%; border: 1px solid #ccc; border-radius: 4px; }
        input[type="number"] { width: 60px; padding: 8px; text-align: center; font-weight: bold; border: 2px solid #3498db; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.btn-blue { background-color: #3498db; width: 100%; margin-top: 15px; font-size: 16px;}
        button.btn-red { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; }
        button.btn-manage { background-color: #f39c12; padding: 5px 10px; font-size: 12px; }
        .logout { float: right; background-color: #e74c3c; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td, th { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .divider-row td { background-color: #2c3e50; height: 3px; padding: 0; }
        .team-name { font-weight: bold; text-align: left; padding-left: 15px; }
        .round-header { background-color: #ecf0f1; padding: 10px; margin-top: 20px; border-radius: 4px; border-left: 4px solid #3498db; }
        .lock-msg { display: none; background: #fff3cd; padding: 15px; border-left: 4px solid #ffc107; margin-bottom: 15px; font-weight: bold; color: #856404; }
        .active-game-label { background: #d4edda; padding: 10px; border-radius: 4px; color: #155724; font-weight: bold; margin-bottom: 15px; border: 1px solid #c3e6cb; display: none; }
    </style>
</head>
<body id="adminBody">

<div class="container">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>⚙️ Admin Dashboard</h1>
    <a href="index.html" target="_blank" style="color: #3498db; font-weight: bold; text-decoration: none;">&rarr; View Live Standings</a>
    <br><br>

    <div class="tab-menu">
        <button id="tabBtn0" class="tab-btn active" onclick="switchTab('gamesTab', this)">1. Games</button>
        <button id="tabBtn1" class="tab-btn" onclick="switchTab('teamsTab', this)">2. Teams</button>
        <button id="tabBtn2" class="tab-btn" onclick="switchTab('roundsTab', this)">3. Rounds & Score</button>
    </div>

    <!-- Active Game Display -->
    <div id="activeGameDisplay" class="active-game-label">Current Game: None Selected</div>

    <!-- TAB 0: Games Management -->
    <div id="gamesTab" class="tab-content active">
        <h3>Create a New Game/Category</h3>
        <input type="text" id="gameName" placeholder="e.g., Junior Category 2026">
        <button onclick="createGame()">Create Game</button>

        <h3 style="margin-top: 30px;">All Games</h3>
        <table>
            <thead><tr><th>Game Name</th><th>Actions</th></tr></thead>
            <tbody id="games-list-body"></tbody>
        </table>
    </div>

    <!-- TAB 1: Team Management -->
    <div id="teamsTab" class="tab-content">
        <div id="teamLockMessage" class="lock-msg">🔒 Tournament has started! Roster is locked.</div>
        <div id="teamSetupControls">
            <h3>Add a New Team</h3>
            <input type="text" id="teamName" placeholder="Enter Team Name">
            <button onclick="addTeam()">Add Team</button>
        </div>
        <h3 style="margin-top: 30px;">Current Teams (<span id="teamCount">0</span>)</h3>
        <table>
            <thead><tr><th>Team Name</th><th>Action</th></tr></thead>
            <tbody id="teams-list-body"></tbody>
        </table>
        <button id="doneTeamsBtn" class="btn-blue" onclick="lockTeamsAndProceed()" style="background-color: #2c3e50;">✅ Done - Proceed to Matches</button>
    </div>

    <!-- TAB 2: Rounds Management -->
    <div id="roundsTab" class="tab-content">
        <p style="font-size: 13px; color: gray; margin-top: 0;">Scores auto-save when you click away.</p>
        <div id="matches-container"></div>
        <button id="generateRoundBtn" class="btn-blue" onclick="generateNextRound()">Generate Round 1</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCGERiYn2mKRHH4O3DSVunFeIQBYn4QjBM",
    authDomain: "makerobot-blitz.firebaseapp.com",
    projectId: "makerobot-blitz",
    storageBucket: "makerobot-blitz.firebasestorage.app",
    messagingSenderId: "343992286368",
    appId: "1:343992286368:web:e5f99c7df490c1d6369dc5"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentGameId = null;
  let currentMaxRound = 0;
  let isTournamentStarted = false;
  let currentTeamsList = [];
  
  // Listeners that we can turn off when switching games
  let unsubTeams = null;
  let unsubMatches = null;

  onAuthStateChanged(auth, user => {
    if (user) document.getElementById("adminBody").style.display = "block";
    else window.location.href = "login.html";
  });
  window.logout = () => signOut(auth).then(() => window.location.href = "login.html");

  window.switchTab = function(tabId, btnElement) {
    if ((tabId === 'teamsTab' || tabId === 'roundsTab') && !currentGameId) {
        return alert("Please select a game from the 'Games' tab first!");
    }
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
  };

  // --- GAME MANAGEMENT ---
  onSnapshot(collection(db, "games"), (snapshot) => {
      const tbody = document.getElementById("games-list-body");
      tbody.innerHTML = "";
      snapshot.forEach(docSnap => {
          const game = docSnap.data();
          tbody.innerHTML += `
              <tr>
                  <td style="font-weight: bold; text-align: left; padding-left: 15px;">${game.name}</td>
                  <td>
                      <button class="btn-manage" onclick="selectGame('${docSnap.id}', '${game.name}')">Manage</button>
                      <button class="btn-red" onclick="deleteGame('${docSnap.id}', '${game.name}')">Delete</button>
                  </td>
              </tr>
          `;
      });
  });

  window.createGame = async function() {
      const name = document.getElementById("gameName").value.trim();
      if(!name) return;
      await addDoc(collection(db, "games"), { name: name, createdAt: new Date() });
      document.getElementById("gameName").value = "";
  };

  window.deleteGame = async function(id, name) {
      if(confirm(`Are you sure you want to delete the ENTIRE GAME "${name}" and all its scores?`)) {
          if(currentGameId === id) {
              currentGameId = null;
              document.getElementById("activeGameDisplay").style.display = "none";
          }
          await deleteDoc(doc(db, "games", id));
      }
  };

  window.selectGame = function(id, name) {
      currentGameId = id;
      document.getElementById("activeGameDisplay").style.display = "block";
      document.getElementById("activeGameDisplay").innerText = `🛠 Currently Managing: ${name}`;
      
      // Stop listening to old game data
      if(unsubTeams) unsubTeams();
      if(unsubMatches) unsubMatches();

      // Listen to teams for THIS game
      unsubTeams = onSnapshot(collection(db, "games", currentGameId, "teams"), (snapshot) => {
          currentTeamsList = [];
          snapshot.forEach(d => currentTeamsList.push({ id: d.id, ...d.data() }));
          renderTeamsList();
      });

      // Listen to matches for THIS game
      const qMatches = query(collection(db, "games", currentGameId, "matches"), orderBy("round", "asc"));
      unsubMatches = onSnapshot(qMatches, (snapshot) => {
          const container = document.getElementById("matches-container");
          container.innerHTML = "";
          let roundsData = {};
          currentMaxRound = 0;

          if (snapshot.size > 0) {
              isTournamentStarted = true;
              document.getElementById("teamSetupControls").style.display = "none";
              document.getElementById("doneTeamsBtn").style.display = "none";
              document.getElementById("teamLockMessage").style.display = "block";
          } else {
              isTournamentStarted = false;
              document.getElementById("teamSetupControls").style.display = "block";
              document.getElementById("doneTeamsBtn").style.display = "block";
              document.getElementById("teamLockMessage").style.display = "none";
          }
          renderTeamsList();

          snapshot.forEach(docSnap => {
              const match = docSnap.data();
              match.id = docSnap.id;
              if(match.round > currentMaxRound) currentMaxRound = match.round;
              if(!roundsData[match.round]) roundsData[match.round] = [];
              roundsData[match.round].push(match);
          });

          document.getElementById("generateRoundBtn").innerText = `Generate Round ${currentMaxRound + 1}`;

          for(let r = 1; r <= currentMaxRound; r++) {
              if(!roundsData[r]) continue;
              let html = `<h3 class="round-header">🏆 Round ${r}</h3><table><thead><tr><th>Match</th><th>Team</th><th>Score (Balls Left)</th></tr></thead><tbody>`;
              roundsData[r].forEach((match, index) => {
                  const aBalls = match.teamA_balls === null ? "" : match.teamA_balls;
                  const bBalls = match.teamB_balls === null ? "" : match.teamB_balls;
                  html += `
                      <tr>
                          <td rowspan="2" style="font-weight:bold;">#${index+1}</td>
                          <td class="team-name">${match.teamA_name}</td>
                          <td><input type="number" min="0" max="10" value="${aBalls}" onchange="updateScore('${match.id}', 'A', this.value)"></td>
                      </tr>
                      <tr>
                          <td class="team-name">${match.teamB_name}</td>
                          <td><input type="number" min="0" max="10" value="${bBalls}" onchange="updateScore('${match.id}', 'B', this.value)"></td>
                      </tr>
                      <tr class="divider-row"><td colspan="3"></td></tr>
                  `;
              });
              html += `</tbody></table>`;
              container.innerHTML += html;
          }
      });

      // Jump to teams tab
      switchTab('teamsTab', document.getElementById('tabBtn1'));
  };

  // --- TEAM MANAGEMENT ---
  window.lockTeamsAndProceed = function() {
      if(currentTeamsList.length < 2) return alert("You need at least 2 teams!");
      switchTab('roundsTab', document.getElementById('tabBtn2'));
  };

  function renderTeamsList() {
      document.getElementById("teamCount").innerText = currentTeamsList.length;
      const tbody = document.getElementById("teams-list-body");
      tbody.innerHTML = "";
      currentTeamsList.forEach(team => {
          const actionHtml = isTournamentStarted 
              ? `<span style="color: #95a5a6; font-style: italic;">Locked</span>` 
              : `<button class="btn-red" onclick="deleteTeam('${team.id}', '${team.name}')">Delete</button>`;
          tbody.innerHTML += `<tr><td style="text-align: left; padding-left: 15px; font-weight: bold;">${team.name}</td><td>${actionHtml}</td></tr>`;
      });
  }

  window.addTeam = async function() {
      const name = document.getElementById("teamName").value.trim();
      if(!name || !currentGameId) return;
      await addDoc(collection(db, "games", currentGameId, "teams"), { name: name, points: 0, balls: 0 });
      document.getElementById("teamName").value = ""; 
  };

  window.deleteTeam = async function(id, name) {
      if(confirm(`Delete ${name}?`)) await deleteDoc(doc(db, "games", currentGameId, "teams", id));
  };

  // --- ROUNDS & SCORING ---
  window.updateScore = async function(matchId, teamSide, value) {
      const updateData = {};
      const numValue = value === "" ? null : parseInt(value);
      if (teamSide === 'A') updateData.teamA_balls = numValue;
      if (teamSide === 'B') updateData.teamB_balls = numValue;
      await updateDoc(doc(db, "games", currentGameId, "matches", matchId), updateData);
      recalculateStandings();
  };

  window.generateNextRound = async function() {
      const targetRound = currentMaxRound + 1;
      if(!confirm(`Generate matches for Round ${targetRound}?`)) return;

      let teams = [...currentTeamsList];
      if(targetRound === 1) teams = teams.sort(() => Math.random() - 0.5); 
      else teams = teams.sort((a, b) => b.points !== a.points ? b.points - a.points : a.balls - b.balls); 

      for(let i = 0; i < teams.length; i += 2) {
          if(i + 1 < teams.length) {
              await addDoc(collection(db, "games", currentGameId, "matches"), {
                  round: targetRound,
                  teamA_id: teams[i].id, teamA_name: teams[i].name,
                  teamB_id: teams[i+1].id, teamB_name: teams[i+1].name,
                  teamA_balls: null, teamB_balls: null
              });
          } else {
              alert(`${teams[i].name} has a BYE in Round ${targetRound}`);
          }
      }
  };

  async function recalculateStandings() {
      let teamStats = {};
      currentTeamsList.forEach(t => teamStats[t.id] = { points: 0, balls: 0 });

      const matchesSnap = await getDocs(collection(db, "games", currentGameId, "matches"));
      matchesSnap.forEach(docSnap => {
          const match = docSnap.data();
          if(match.teamA_balls !== null && match.teamB_balls !== null) {
              let aPts = 0, bPts = 0;
              if(match.teamA_balls < match.teamB_balls) { aPts = 2; bPts = 0; }
              else if(match.teamB_balls < match.teamA_balls) { aPts = 0; bPts = 2; }
              else { aPts = 1; bPts = 1; }

              if(teamStats[match.teamA_id]) { teamStats[match.teamA_id].points += aPts; teamStats[match.teamA_id].balls += match.teamA_balls; }
              if(teamStats[match.teamB_id]) { teamStats[match.teamB_id].points += bPts; teamStats[match.teamB_id].balls += match.teamB_balls; }
          }
      });

      for (let teamId in teamStats) {
          await updateDoc(doc(db, "games", currentGameId, "teams", teamId), {
              points: teamStats[teamId].points, balls: teamStats[teamId].balls
          });
      }
  }
</script>
</body>
</html>
