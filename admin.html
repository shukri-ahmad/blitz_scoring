<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; display: none; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        h1 { color: #2c3e50; }
        input[type="text"] { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="number"] { width: 80px; padding: 8px; text-align: center; font-weight: bold; border: 2px solid #3498db; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px;}
        button.btn-blue { background-color: #3498db; }
        .logout { float: right; background-color: #e74c3c; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td, th { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .divider-row td { background-color: #2c3e50; height: 4px; padding: 0; }
        .team-name { font-weight: bold; font-size: 1.1em; text-align: left; padding-left: 15px; }
    </style>
</head>
<body id="adminBody">

<div class="container">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>⚙️ Admin Dashboard</h1>
    <a href="index.html" target="_blank">View Live Standings</a>
    <hr><br>

    <div class="section">
        <h3>1. Add Teams</h3>
        <input type="text" id="teamName" placeholder="Enter Team Name" style="width: calc(100% - 120px);">
        <button onclick="addTeam()">Add Team</button>
        <p id="teamCount">Teams added: 0</p>
    </div>

    <div class="section">
        <h3>2. Matches & Scoring (Auto-Saves)</h3>
        <button class="btn-blue" onclick="generateRoundOne()">Generate Round 1</button>
        <p style="font-size: 12px; color: gray;">Just type the score and click away. It saves automatically!</p>
        
        <table>
            <thead>
                <tr>
                    <th>Match</th>
                    <th>Team</th>
                    <th>Balls Left (Score)</th>
                </tr>
            </thead>
            <tbody id="matches-body">
                <!-- Matches will generate here -->
            </tbody>
        </table>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCGERiYn2mKRHH4O3DSVunFeIQBYn4QjBM",
    authDomain: "makerobot-blitz.firebaseapp.com",
    projectId: "makerobot-blitz",
    storageBucket: "makerobot-blitz.firebasestorage.app",
    messagingSenderId: "343992286368",
    appId: "1:343992286368:web:e5f99c7df490c1d6369dc5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (user) { document.getElementById("adminBody").style.display = "block"; } 
    else { window.location.href = "login.html"; }
  });

  window.logout = () => signOut(auth).then(() => window.location.href = "login.html");

  // Track total teams added
  onSnapshot(collection(db, "teams"), (snapshot) => {
    document.getElementById("teamCount").innerText = `Teams added: ${snapshot.size}`;
  });

  window.addTeam = async function() {
    const nameInput = document.getElementById("teamName");
    const name = nameInput.value.trim();
    if(!name) return;
    await addDoc(collection(db, "teams"), { name: name, points: 0, balls: 0 });
    nameInput.value = ""; 
  };

  // Generate Matches Algorithm
  window.generateRoundOne = async function() {
    if(!confirm("Generate Round 1? This will randomly pair all current teams.")) return;
    
    const teamsSnap = await getDocs(collection(db, "teams"));
    let teams = [];
    teamsSnap.forEach(doc => teams.push({id: doc.id, name: doc.data().name}));
    
    // Shuffle teams for random Matchups
    teams = teams.sort(() => Math.random() - 0.5);

    for(let i = 0; i < teams.length; i += 2) {
        if(i + 1 < teams.length) {
            await addDoc(collection(db, "matches"), {
                round: 1,
                teamA_id: teams[i].id,
                teamA_name: teams[i].name,
                teamB_id: teams[i+1].id,
                teamB_name: teams[i+1].name,
                teamA_balls: null,
                teamB_balls: null
            });
        } else {
            alert(`${teams[i].name} has a BYE (no opponent) because of odd team numbers.`);
        }
    }
  };

  // Listen to matches and build the UI Table
  onSnapshot(collection(db, "matches"), (snapshot) => {
    const tbody = document.getElementById("matches-body");
    tbody.innerHTML = "";
    let matchNumber = 1;

    snapshot.forEach((docSnap) => {
        const match = docSnap.data();
        const id = docSnap.id;
        const aBalls = match.teamA_balls === null ? "" : match.teamA_balls;
        const bBalls = match.teamB_balls === null ? "" : match.teamB_balls;

        tbody.innerHTML += `
            <tr>
                <td rowspan="2" style="font-weight:bold;">#${matchNumber}</td>
                <td class="team-name">${match.teamA_name}</td>
                <td><input type="number" min="0" max="10" value="${aBalls}" onchange="updateScore('${id}', 'A', this.value)"></td>
            </tr>
            <tr>
                <td class="team-name">${match.teamB_name}</td>
                <td><input type="number" min="0" max="10" value="${bBalls}" onchange="updateScore('${id}', 'B', this.value)"></td>
            </tr>
            <tr class="divider-row"><td colspan="3"></td></tr>
        `;
        matchNumber++;
    });
  });

  // Auto-Save Function
  window.updateScore = async function(matchId, teamSide, value) {
    const updateData = {};
    const numValue = value === "" ? null : parseInt(value);
    
    if (teamSide === 'A') updateData.teamA_balls = numValue;
    if (teamSide === 'B') updateData.teamB_balls = numValue;
    
    // 1. Save the score to the match
    await updateDoc(doc(db, "matches", matchId), updateData);
    
    // 2. Automatically recalculate the entire leaderboard
    recalculateStandings();
  };

  // Master Recalculator: recalculates all points based on all matches
  async function recalculateStandings() {
    const teamsSnap = await getDocs(collection(db, "teams"));
    let teamStats = {};
    teamsSnap.forEach(doc => teamStats[doc.id] = { points: 0, balls: 0 });

    const matchesSnap = await getDocs(collection(db, "matches"));
    matchesSnap.forEach(docSnap => {
        const match = docSnap.data();
        // Only calculate if BOTH teams have a score entered
        if(match.teamA_balls !== null && match.teamB_balls !== null) {
            let aPts = 0, bPts = 0;
            if(match.teamA_balls < match.teamB_balls) { aPts = 2; bPts = 0; }
            else if(match.teamB_balls < match.teamA_balls) { aPts = 0; bPts = 2; }
            else { aPts = 1; bPts = 1; }

            if(teamStats[match.teamA_id]) {
                teamStats[match.teamA_id].points += aPts;
                teamStats[match.teamA_id].balls += match.teamA_balls;
            }
            if(teamStats[match.teamB_id]) {
                teamStats[match.teamB_id].points += bPts;
                teamStats[match.teamB_id].balls += match.teamB_balls;
            }
        }
    });

    // Save recalculated totals to database
    for (let teamId in teamStats) {
        await updateDoc(doc(db, "teams", teamId), {
            points: teamStats[teamId].points,
            balls: teamStats[teamId].balls
        });
    }
  }
</script>

</body>
</html>
