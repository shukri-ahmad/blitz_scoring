<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKEROBOT BLITZ - Live Standings</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px;}
        h1, h2 { text-align: center; color: #2c3e50; }
        .header-links { text-align: right; margin-bottom: 20px; }
        .header-links a { color: #3498db; text-decoration: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        .rank-1 { background-color: #fff3cd !important; font-weight: bold; }
        
        .round-header { background-color: #ecf0f1; padding: 10px; margin-top: 25px; border-radius: 4px; border-left: 4px solid #3498db; font-size: 18px; font-weight: bold;}
        .match-table td { padding: 10px; }
        .divider-row td { background-color: #2c3e50; height: 3px; padding: 0; }
        .team-name { font-weight: bold; text-align: left; padding-left: 20px; }
        .score-box { font-size: 1.2em; font-weight: bold; background: #eee; border-radius: 4px; display: inline-block; width: 40px; padding: 5px; }
        .winner { background: #d4edda; color: #155724; border: 2px solid #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links"><a href="login.html">Admin Login &rarr;</a></div>
    <h1>🤖 MAKEROBOT BLITZ Standings</h1>
    <table>
        <thead>
            <tr><th>Rank</th><th>Team Name</th><th>Points</th><th>Total Balls</th></tr>
        </thead>
        <tbody id="leaderboard-body"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
</div>

<div class="container">
    <h2>⚔️ Tournament Matches</h2>
    <div id="matches-container">
        <p style="text-align: center;">Waiting for matches to start...</p>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGERiYn2mKRHH4O3DSVunFeIQBYn4QjBM",
    authDomain: "makerobot-blitz.firebaseapp.com",
    projectId: "makerobot-blitz",
    storageBucket: "makerobot-blitz.firebasestorage.app",
    messagingSenderId: "343992286368",
    appId: "1:343992286368:web:e5f99c7df490c1d6369dc5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. Leaderboard Listener
  onSnapshot(collection(db, "teams"), (snapshot) => {
    let teams = [];
    snapshot.forEach(doc => teams.push({ id: doc.id, ...doc.data() }));
    teams.sort((a, b) => b.points !== a.points ? b.points - a.points : a.balls - b.balls);
    
    const tbody = document.getElementById("leaderboard-body");
    tbody.innerHTML = ""; 
    teams.forEach((team, index) => {
      tbody.innerHTML += `
        <tr class="${index === 0 ? 'rank-1' : ''}">
          <td>${index + 1}</td>
          <td><strong>${team.name}</strong></td>
          <td>${team.points}</td>
          <td>${team.balls}</td>
        </tr>`;
    });
  });

  // 2. Grouped Matches Listener
  const qMatches = query(collection(db, "matches"), orderBy("round", "asc"));
  onSnapshot(qMatches, (snapshot) => {
    const container = document.getElementById("matches-container");
    if(snapshot.empty) return;
    container.innerHTML = "";
    
    let roundsData = {};
    let maxRound = 0;

    snapshot.forEach((docSnap) => {
        const match = docSnap.data();
        if(match.round > maxRound) maxRound = match.round;
        if(!roundsData[match.round]) roundsData[match.round] = [];
        roundsData[match.round].push(match);
    });

    for(let r = 1; r <= maxRound; r++) {
        if(!roundsData[r]) continue;
        let html = `<div class="round-header">🏆 Round ${r}</div><table class="match-table"><thead><tr><th>Match</th><th>Team</th><th>Score</th></tr></thead><tbody>`;
        
        roundsData[r].forEach((match, index) => {
            const aBalls = match.teamA_balls === null ? "-" : match.teamA_balls;
            const bBalls = match.teamB_balls === null ? "-" : match.teamB_balls;
            let aClass = "score-box", bClass = "score-box";
            
            if(aBalls !== "-" && bBalls !== "-") {
                if(aBalls < bBalls) aClass += " winner";
                if(bBalls < aBalls) bClass += " winner";
            }

            html += `
                <tr>
                    <td rowspan="2" style="font-weight:bold;">#${index+1}</td>
                    <td class="team-name">${match.teamA_name}</td>
                    <td><span class="${aClass}">${aBalls}</span></td>
                </tr>
                <tr>
                    <td class="team-name">${match.teamB_name}</td>
                    <td><span class="${bClass}">${bBalls}</span></td>
                </tr>
                <tr class="divider-row"><td colspan="3"></td></tr>
            `;
        });
        html += `</tbody></table>`;
        container.innerHTML += html;
    }
  });
</script>

</body>
</html>
