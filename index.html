<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKEROBOT BLITZ - Live Standings</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px;}
        h1, h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .header-links { text-align: right; margin-bottom: 10px; }
        .header-links a { color: #3498db; text-decoration: none; font-weight: bold; }
        
        .game-selector { text-align: center; margin-bottom: 25px; padding: 15px; background: #ecf0f1; border-radius: 8px; border: 2px solid #bdc3c7; }
        .game-selector select { padding: 10px; font-size: 16px; border-radius: 4px; font-weight: bold; width: 60%; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        .rank-1 { background-color: #fff3cd !important; font-weight: bold; }
        
        .round-header { background-color: #ecf0f1; padding: 12px; margin-top: 30px; border-radius: 4px; border-left: 5px solid #3498db; font-size: 20px; font-weight: bold; color: #2c3e50;}
        .match-table td { padding: 10px; }
        .divider-row td { background-color: #2c3e50; height: 3px; padding: 0; border: none; }
        .team-name { font-weight: bold; text-align: left; padding-left: 20px; }
        
        .score-box { font-size: 1.2em; font-weight: bold; background: #eee; border-radius: 4px; display: inline-block; width: 40px; padding: 5px; }
        .winner-score { background: #d4edda; color: #155724; border: 2px solid #2ecc71; }
        .result-text { font-weight: bold; font-size: 1.1em; }
        .res-win { color: #27ae60; }
        .res-loss { color: #e74c3c; }
        .res-draw { color: #f39c12; }
        .res-pending { color: #95a5a6; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links"><a href="login.html">Admin Login &rarr;</a></div>
    <h1>🤖 MAKEROBOT BLITZ</h1>
    
    <div class="game-selector">
        <label for="publicGameSelect" style="font-weight: bold; display: block; margin-bottom: 8px;">Select Game/Category:</label>
        <select id="publicGameSelect" onchange="loadSelectedGame()"><option>Loading games...</option></select>
    </div>

    <h2>🏆 Overall Standings</h2>
    <p style="text-align: center; font-size: 14px; color: #666; margin-top: -10px;">Ranked by highest Points. Tie-breaker: Lowest Balls.</p>
    <table>
        <thead><tr><th>Rank</th><th>Team Name</th><th>Points</th><th>Total Balls</th></tr></thead>
        <tbody id="leaderboard-body"><tr><td colspan="4">Please select a game.</td></tr></tbody>
    </table>
</div>

<div class="container">
    <h2>⚔️ Tournament Matches</h2>
    <div id="matches-container">
        <p style="text-align: center;">Please select a game above.</p>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCGERiYn2mKRHH4O3DSVunFeIQBYn4QjBM",
    authDomain: "makerobot-blitz.firebaseapp.com",
    projectId: "makerobot-blitz",
    storageBucket: "makerobot-blitz.firebasestorage.app",
    messagingSenderId: "343992286368",
    appId: "1:343992286368:web:e5f99c7df490c1d6369dc5"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let unsubTeams = null;
  let unsubMatches = null;

  // Load games into dropdown on page load
  async function loadGamesList() {
      const selectElement = document.getElementById("publicGameSelect");
      const gamesSnap = await getDocs(collection(db, "games"));
      
      selectElement.innerHTML = "";
      if(gamesSnap.empty) {
          selectElement.innerHTML = "<option>No games created yet.</option>";
          return;
      }

      gamesSnap.forEach(doc => {
          selectElement.innerHTML += `<option value="${doc.id}">${doc.data().name}</option>`;
      });

      // Automatically load the first game in the list
      loadSelectedGame();
  }
  loadGamesList();

  window.loadSelectedGame = function() {
      const gameId = document.getElementById("publicGameSelect").value;
      if(!gameId || gameId === "No games created yet.") return;

      if(unsubTeams) unsubTeams();
      if(unsubMatches) unsubMatches();

      // 1. Leaderboard Listener
      unsubTeams = onSnapshot(collection(db, "games", gameId, "teams"), (snapshot) => {
        let teams = [];
        snapshot.forEach(doc => teams.push({ id: doc.id, ...doc.data() }));
        teams.sort((a, b) => b.points !== a.points ? b.points - a.points : a.balls - b.balls);
        
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = ""; 
        if (teams.length === 0) return tbody.innerHTML = "<tr><td colspan='4'>No teams registered for this game.</td></tr>";

        teams.forEach((team, index) => {
          tbody.innerHTML += `
            <tr class="${index === 0 ? 'rank-1' : ''}">
              <td>${index + 1}</td>
              <td><strong>${team.name}</strong></td>
              <td style="font-size: 1.1em; font-weight: bold;">${team.points}</td>
              <td>${team.balls}</td>
            </tr>`;
        });
      });

      // 2. Matches Listener
      const qMatches = query(collection(db, "games", gameId, "matches"), orderBy("round", "asc"));
      unsubMatches = onSnapshot(qMatches, (snapshot) => {
        const container = document.getElementById("matches-container");
        container.innerHTML = "";
        if(snapshot.empty) return container.innerHTML = "<p style='text-align:center;'>Waiting for matches to start...</p>";
        
        let roundsData = {};
        let maxRound = 0;

        snapshot.forEach((docSnap) => {
            const match = docSnap.data();
            if(match.round > maxRound) maxRound = match.round;
            if(!roundsData[match.round]) roundsData[match.round] = [];
            roundsData[match.round].push(match);
        });

        for(let r = 1; r <= maxRound; r++) {
            if(!roundsData[r]) continue;
            let html = `<div class="round-header">📌 Round ${r}</div><table class="match-table"><thead><tr><th>Match</th><th>Team</th><th>Score</th><th>Result</th></tr></thead><tbody>`;
            
            roundsData[r].forEach((match, index) => {
                const aBalls = match.teamA_balls === null ? "-" : match.teamA_balls;
                const bBalls = match.teamB_balls === null ? "-" : match.teamB_balls;
                
                let aClass = "score-box", bClass = "score-box";
                let aResult = "<span class='res-pending'>Pending</span>", bResult = "<span class='res-pending'>Pending</span>";
                
                if(aBalls !== "-" && bBalls !== "-") {
                    if(aBalls < bBalls) { aClass += " winner-score"; aResult = "<span class='result-text res-win'>🏆 WIN</span>"; bResult = "<span class='result-text res-loss'>❌ LOSS</span>"; } 
                    else if(bBalls < aBalls) { bClass += " winner-score"; bResult = "<span class='result-text res-win'>🏆 WIN</span>"; aResult = "<span class='result-text res-loss'>❌ LOSS</span>"; } 
                    else { aResult = "<span class='result-text res-draw'>🤝 DRAW</span>"; bResult = "<span class='result-text res-draw'>🤝 DRAW</span>"; }
                }

                html += `
                    <tr><td rowspan="2" style="font-weight:bold; font-size: 1.1em;">#${index+1}</td>
                        <td class="team-name">${match.teamA_name}</td><td><span class="${aClass}">${aBalls}</span></td><td>${aResult}</td></tr>
                    <tr><td class="team-name">${match.teamB_name}</td><td><span class="${bClass}">${bBalls}</span></td><td>${bResult}</td></tr>
                    <tr class="divider-row"><td colspan="4"></td></tr>
                `;
            });
            html += `</tbody></table>`;
            container.innerHTML += html;
        }
      });
  };
</script>

</body>
</html>
