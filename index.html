<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKEROBOT BLITZ - Live Standings</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .header-links { text-align: right; margin-bottom: 20px; }
        .header-links a { color: #3498db; text-decoration: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .rank-1 { background-color: #fff3cd !important; font-weight: bold; } /* Gold for 1st place */
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <a href="login.html">Admin Login &rarr;</a>
    </div>
    <h1>🤖 MAKEROBOT BLITZ Standings</h1>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Team Name</th>
                <th>Points (More = Better)</th>
                <th>Total Balls (Less = Better)</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr><td colspan="4">Loading live standings...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your specific Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCGERiYn2mKRHH4O3DSVunFeIQBYn4QjBM",
    authDomain: "makerobot-blitz.firebaseapp.com",
    projectId: "makerobot-blitz",
    storageBucket: "makerobot-blitz.firebasestorage.app",
    messagingSenderId: "343992286368",
    appId: "1:343992286368:web:e5f99c7df490c1d6369dc5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  onSnapshot(collection(db, "teams"), (snapshot) => {
    let teams = [];
    snapshot.forEach((doc) => {
      teams.push({ id: doc.id, ...doc.data() });
    });

    // Sort: Highest points first, then lowest balls
    teams.sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      return a.balls - b.balls;
    });

    const tbody = document.getElementById("leaderboard-body");
    tbody.innerHTML = ""; 

    if (teams.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4'>No teams registered yet.</td></tr>";
        return;
    }

    teams.forEach((team, index) => {
      const isFirst = index === 0 ? "rank-1" : "";
      tbody.innerHTML += `
        <tr class="${isFirst}">
          <td>${index + 1}</td>
          <td><strong>${team.name}</strong></td>
          <td>${team.points}</td>
          <td>${team.balls}</td>
        </tr>
      `;
    });
  });
</script>

</body>
</html>
