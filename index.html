<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKEROBOT BLITZ - Live Standings</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-gear: #e72429;
            --blue-gear: #1f4179;
            --purple-grad: linear-gradient(90deg, #3d1259 0%, #7b2cbf 100%);
            --purple-accent: #9d4edd;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
            --text-main: #c9d1d9;
            --neon-green: #00ff88;
        }

        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(31, 65, 121, 0.2) 0%, transparent 50%); }
        .container { max-width: 1000px; margin: 0 auto; background: var(--panel-bg); padding: 20px 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 1px solid var(--border-glow); margin-bottom: 30px; }
        
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-align: center; color: white; letter-spacing: 1px; text-transform: uppercase; margin-top: 0;}
        
        .header-links { text-align: right; margin-bottom: 10px; }
        .header-links a { color: var(--purple-accent); text-decoration: none; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 14px; text-transform: uppercase; transition: color 0.3s;}
        .header-links a:hover { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        
        .game-selector { text-align: center; margin-bottom: 25px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid #30363d; }
        .game-selector select { padding: 10px; font-size: 16px; border-radius: 4px; font-weight: bold; width: 50%; background: #0d1117; color: white; border: 1px solid var(--border-glow); font-family: 'Rajdhani', sans-serif; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 18px; }
        th, td { padding: 15px 12px; text-align: center; border-bottom: 1px solid #30363d; vertical-align: middle;}
        th { background: var(--purple-grad); color: white; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; }
        
        .rank-1 { background: rgba(157, 78, 221, 0.15) !important; }
        .rank-1 td { color: #fff; font-weight: bold; text-shadow: 0 0 5px var(--purple-accent); }
        
        .team-name { font-weight: bold; text-align: left; padding-left: 20px; font-size: 1.2em; color: white;}
        .win-box { font-size: 1.2em; font-weight: bold; color: var(--neon-green); text-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .formula-text { text-align: center; font-size: 14px; color: #8b949e; margin-top: -10px; margin-bottom: 20px; font-weight: bold;}
        
        .history-section-title { margin-top: 50px; margin-bottom: 10px; text-align: left; color: var(--neon-green); border-bottom: 1px solid #30363d; padding-bottom: 10px; font-size: 20px;}
        .public-round-header { background: var(--blue-gear); padding: 10px; margin-top: 20px; border-radius: 4px; border-left: 4px solid var(--purple-accent); color: white; font-family: 'Orbitron', sans-serif; font-weight: bold; text-align: left;}
        .match-divider td { background-color: #30363d; height: 1px; padding: 0; border: none; opacity: 0.5; }
        
        .tie-badge { color: var(--red-gear); font-size: 11px; display: block; font-weight: bold; margin-top: 5px;}
    </style>
</head>
<body>

<div class="container">
    <div class="header-links"><a href="admin.html">[ ADMIN TERMINAL ]</a></div>
    
    <div style="text-align: center; margin-bottom: 10px;">
        <img src="[FINAL] LOGO MAKEROBOT2026 (9)-Photoroom.png" alt="Logo" style="max-width: 250px;">
        <h2 style="font-size: 32px; color: var(--purple-accent); margin-top: 10px;">MAKEROBOT BLITZ</h2>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 14px; color: #8b949e; letter-spacing: 2px;">LIVE TOURNAMENT STANDINGS</div>
    </div>
    
    <div class="game-selector">
        <label for="publicGameSelect" style="font-weight: bold; display: block; margin-bottom: 8px; color: #8b949e; font-family: 'Orbitron', sans-serif;">SELECT CATEGORY</label>
        <select id="publicGameSelect" onchange="loadSelectedGame()"><option>INITIALIZING...</option></select>
    </div>

    <p class="formula-text">RANKED BY: HIGHEST POINTS (WINS/DRAWS) ➔ LEAST BALLS LEFT ➔ TIE-BREAKER MATCH</p>
    
    <table>
        <thead>
            <tr>
                <th>RANK</th>
                <th>TEAM UNIT</th>
                <th>POINTS</th>
                <th>TOTAL BALLS LEFT</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body"><tr><td colspan="4">AWAITING DATA...</td></tr></tbody>
    </table>

    <h3 class="history-section-title">TOURNAMENT MATCH HISTORY</h3>
    <div id="matches-history-container">
        <p style="text-align: center; color: #8b949e;">Awaiting match data...</p>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCbDoYDHtApreoGBJTSXby8aHPft3WRFDE",
    authDomain: "makerobot-blitz-1ec81.firebaseapp.com",
    projectId: "makerobot-blitz-1ec81",
    storageBucket: "makerobot-blitz-1ec81.firebasestorage.app",
    messagingSenderId: "122915710835",
    appId: "1:122915710835:web:8f494062147f804e53c706"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let unsubTeams = null;
  let unsubMatches = null;

  async function loadGamesList() {
      const selectElement = document.getElementById("publicGameSelect");
      const gamesSnap = await getDocs(collection(db, "games"));
      selectElement.innerHTML = "";
      if(gamesSnap.empty) return selectElement.innerHTML = "<option>NO GAMES FOUND</option>";

      gamesSnap.forEach(documentDoc => { 
          selectElement.innerHTML += `<option value="${documentDoc.id}">${documentDoc.data().name}</option>`; 
      });
      loadSelectedGame();
  }
  loadGamesList();

  window.loadSelectedGame = function() {
      const gameId = document.getElementById("publicGameSelect").value;
      if(!gameId || gameId === "NO GAMES FOUND") return;

      if(unsubTeams) unsubTeams();
      if(unsubMatches) unsubMatches();

      unsubTeams = onSnapshot(collection(db, "games", gameId, "teams"), (snapshot) => {
        let teams = [];

        snapshot.forEach(documentDoc => {
            teams.push({ id: documentDoc.id, ...documentDoc.data() });
        });

        // Sort Data
        teams.sort((a, b) => {
            if ((b.points || 0) !== (a.points || 0)) return (b.points || 0) - (a.points || 0);
            return (a.balls || 0) - (b.balls || 0); 
        });

        // Compute TRUE RANK and check for TIES
        let currentRank = 1;
        teams.forEach((t, i) => {
            if (i > 0) {
                let prev = teams[i-1];
                if (prev.points !== t.points || prev.balls !== t.balls) currentRank = i + 1;
            }
            t.rank = currentRank;
            
            let tiedWithPrev = (i > 0 && teams[i-1].points === t.points && teams[i-1].balls === t.balls);
            let tiedWithNext = (i < teams.length - 1 && teams[i+1].points === t.points && teams[i+1].balls === t.balls);
            t.isTied = tiedWithPrev || tiedWithNext;
        });
        
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = ""; 
        if (teams.length === 0) return tbody.innerHTML = "<tr><td colspan='4'>NO TEAMS REGISTERED.</td></tr>";

        teams.forEach((team, index) => {
          let tieHTML = team.isTied ? `<span class="tie-badge">[TIE]</span>` : '';
            
          tbody.innerHTML += `
            <tr class="${index === 0 && (team.points > 0 || team.balls > 0) ? 'rank-1' : ''}">
              <td style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.2em;">${team.rank} ${tieHTML}</td>
              <td class="team-name">${team.name}</td>
              <td class="win-box">${team.points || 0}</td>
              <td style="font-family: 'Orbitron', sans-serif; font-weight: bold;">${team.balls || 0}</td>
            </tr>`;
        });
      });

      const qMatches = query(collection(db, "games", gameId, "matches"), orderBy("round", "asc"));
      unsubMatches = onSnapshot(qMatches, (snapshot) => {
          const container = document.getElementById("matches-history-container");
          container.innerHTML = "";
          
          if (snapshot.size === 0) {
              container.innerHTML = `<p style="text-align: center; color: #8b949e;">No matches generated yet.</p>`;
              return;
          }

          let roundsData = {};
          let maxRound = 0;

          snapshot.forEach(docSnap => {
              const match = docSnap.data();
              if(match.round > maxRound) maxRound = match.round;
              if(!roundsData[match.round]) roundsData[match.round] = [];
              roundsData[match.round].push(match);
          });

          for (let r = 1; r <= maxRound; r++) {
              if (!roundsData[r]) continue;
              
              let html = `<div class="public-round-header">ROUND ${r}</div>`;
              html += `<table><thead><tr><th>MATCH</th><th>TEAM UNIT</th><th>BALLS</th><th>RESULT</th></tr></thead><tbody>`;
              
              roundsData[r].forEach((match, index) => {
                  const aBalls = match.teamA_balls === null ? "-" : match.teamA_balls;
                  const bBalls = match.teamB_balls === null ? "-" : match.teamB_balls;
                  
                  let aStatus = "-", bStatus = "-";
                  let aColor = "white", bColor = "white";

                  if (match.teamA_balls !== null && match.teamB_balls !== null) {
                      if (match.teamA_balls < match.teamB_balls) {
                          aStatus = "WIN"; bStatus = "LOSS";
                          aColor = "var(--neon-green)"; bColor = "var(--red-gear)";
                      } else if (match.teamB_balls < match.teamA_balls) {
                          aStatus = "LOSS"; bStatus = "WIN";
                          aColor = "var(--red-gear)"; bColor = "var(--neon-green)";
                      } else {
                          aStatus = "DRAW"; bStatus = "DRAW";
                          aColor = "#f39c12"; bColor = "#f39c12";
                      }
                  }

                  html += `
                      <tr>
                          <td rowspan="2" style="font-family: 'Orbitron', sans-serif; font-weight: bold; width: 10%;">#${index+1}</td>
                          <td class="team-name" style="color: ${aColor};">${match.teamA_name}</td>
                          <td style="font-weight: bold; font-size: 1.2em; width: 15%;">${aBalls}</td>
                          <td style="color: ${aColor}; font-weight: bold; font-family: 'Orbitron', sans-serif; width: 15%;">${aStatus}</td>
                      </tr>
                      <tr>
                          <td class="team-name" style="color: ${bColor};">${match.teamB_name}</td>
                          <td style="font-weight: bold; font-size: 1.2em;">${bBalls}</td>
                          <td style="color: ${bColor}; font-weight: bold; font-family: 'Orbitron', sans-serif;">${bStatus}</td>
                      </tr>
                      <tr class="match-divider"><td colspan="4"></td></tr>
                  `;
              });
              html += `</tbody></table>`;
              container.innerHTML += html;
          }
      });
  };
</script>

</body>
</html>
